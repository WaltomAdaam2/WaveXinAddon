plugins {
    id "fabric-loom" version "1.16.3"
}

base {
    archivesName.set(project.archives_base_name)
    version = project.mod_version
    group = project.maven_group
}

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven {
        url = "https://maven.fabricmc.net"
    }
    mavenCentral()
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor Client
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"

}

tasks {
    processResources {
        def propertyMap = [
            "version"       : project.version,
            "mc_version"    : project.minecraft_version,
            "loader_version": project.loader_version,
        ]

        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")

            programArgs("--username", "日天")
            vmArgs("-Dfabric.development=true")
        }
    }
}

def waveXinLangDir = layout.projectDirectory.dir("src/main/resources/assets/wavexin/lang")
def waveXinJavaDir = layout.projectDirectory.dir("src/main/java/me/waltom/wavexin")

tasks.register("verifyWaveXinTranslations") {
    inputs.dir(waveXinLangDir)
    inputs.dir(waveXinJavaDir)

    doLast {
        def jsonSlurper = new groovy.json.JsonSlurper()
        def langFiles = [en_us: waveXinLangDir.file("en_us.json").asFile, zh_cn: waveXinLangDir.file("zh_cn.json").asFile]
        def langs = [:]
        def errors = []

        def duplicateKeys = { File file ->
            def text = file.getText("UTF-8")
            def seen = new LinkedHashSet<String>()
            def duplicates = []
            def matcher = text =~ /(?m)^\s*"((?:\\.|[^"\\])+)"\s*:/
            matcher.each { match ->
                def key = match[1]
                if (!seen.add(key)) duplicates << key
            }
            duplicates
        }

        langFiles.each { language, file ->
            if (!file.isFile()) {
                errors << "Missing language file: ${file}"
                return
            }
            def duplicates = duplicateKeys(file)
            if (!duplicates.isEmpty()) errors << "${language} duplicate keys: ${duplicates.unique().join(', ')}"
            def parsed = jsonSlurper.parse(file)
            if (!(parsed instanceof Map)) errors << "${language} root must be a JSON object"
            parsed.each { key, value ->
                if (!(value instanceof String)) errors << "${language}.${key} must be a string"
                if (value instanceof String) {
                    if (value.contains('\uFFFD')) errors << "${language}.${key} contains replacement character"
                    if (value ==~ /.*(鎺|闃|姝|缁|娴|鑵|锛|绉|嗘|\?\?\?).*/) errors << "${language}.${key} looks mojibake"
                    if (value != value.trim()) errors << "${language}.${key} has leading/trailing whitespace"
                    if (value == key) errors << "${language}.${key} value is the raw key"
                    if (value.isEmpty() && key != 'setting.wavexin.auto_login.saved_accounts.unnamed.title') errors << "${language}.${key} is empty"
                }
            }
            langs[language] = parsed
        }

        if (langs.en_us && langs.zh_cn) {
            def enKeys = langs.en_us.keySet() as Set
            def zhKeys = langs.zh_cn.keySet() as Set
            def missingZh = enKeys - zhKeys
            def missingEn = zhKeys - enKeys
            if (!missingZh.isEmpty()) errors << "zh_cn missing keys: ${missingZh.sort().join(', ')}"
            if (!missingEn.isEmpty()) errors << "en_us missing keys: ${missingEn.sort().join(', ')}"

            def placeholders = { String value ->
                def result = []
                int implicit = 1
                def matcher = value =~ /%(?:([1-9]\d*)\$)?[-#+ 0,(<]*\d*(?:\.\d+)?([a-zA-Z%])/
                matcher.each { match ->
                    def conversion = match[2]
                    if (conversion == '%') return
                    def index = match[1] ?: String.valueOf(implicit++)
                    result << "${index}:${conversion}"
                }
                result
            }
            def meteorTokens = { String value ->
                def result = []
                def matcher = value =~ /\((highlight|bold|default)\)/
                matcher.each { match -> result << match[1] }
                result
            }
            enKeys.intersect(zhKeys).each { key ->
                def enPlaceholders = placeholders(langs.en_us[key])
                def zhPlaceholders = placeholders(langs.zh_cn[key])
                if (enPlaceholders != zhPlaceholders) errors << "Placeholder mismatch ${key}: en=${enPlaceholders}, zh=${zhPlaceholders}"
                def enTokens = meteorTokens(langs.en_us[key])
                def zhTokens = meteorTokens(langs.zh_cn[key])
                if (enTokens != zhTokens) errors << "Meteor token mismatch ${key}: en=${enTokens}, zh=${zhTokens}"
            }
        }

        def staticKeys = new LinkedHashSet<String>()
        waveXinJavaDir.asFileTree.matching { include '**/*.java' }.files.each { file ->
            def source = file.getText('UTF-8')
            def matcher = source =~ /"((?:module|group|setting|enum|message|warning|error|debug|status|button|tooltip|placeholder|disconnect|entity)\.wavexin\.[^"]+)"/
            matcher.each { match ->
                def key = match[1]
                if (!key.contains('" + ') && !key.endsWith('.')) staticKeys << key
            }
        }
        if (langs.en_us) {
            def missingStatic = staticKeys - langs.en_us.keySet()
            if (!missingStatic.isEmpty()) errors << "Static Java keys missing from language files: ${missingStatic.sort().join(', ')}"
        }

        def formatterCases = [
            ['Hello %s %d', ['A', 1] as Object[], 'Hello A 1'],
            ['%2$s -> %1$s', ['A', 'B'] as Object[], 'B -> A'],
            ['%1$s / %1$s', ['A'] as Object[], 'A / A'],
            ['%1$s:%2$d', ['A', 2] as Object[], 'A:2'],
            ['Progress %% %s', ['done'] as Object[], 'Progress % done']
        ]
        formatterCases.each { c ->
            def actual = String.format(Locale.ROOT, c[0], c[1])
            if (actual != c[2]) errors << "Formatter sanity failed for ${c[0]}: ${actual}"
        }

        def totalKeys = langs.en_us ? langs.en_us.size() : 0
        def deadKeys = 0
        def collisions = 0
        def placeholderMismatches = errors.count { it.startsWith('Placeholder mismatch') }
        println "WaveXin translation verification: en_us=${langs.en_us?.size() ?: 0}, zh_cn=${langs.zh_cn?.size() ?: 0}, static=${staticKeys.size()}, dynamic=runtime, dead=${deadKeys}, collisions=${collisions}, placeholderMismatches=${placeholderMismatches}, total=${totalKeys}"

        if (!errors.isEmpty()) {
            throw new GradleException("WaveXin translation verification failed:\n" + errors.join('\n'))
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("verifyWaveXinTranslations"))
}
