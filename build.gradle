plugins {
    id "fabric-loom" version "1.7-SNAPSHOT"
}

base {
    archivesName.set(project.archives_base_name)
    version = "${project.mod_version}+mc${project.minecraft_version}"
    group = project.maven_group
}

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven {
        url = "https://maven.fabricmc.net"
    }
    mavenCentral()
}

sourceSets {
    main {
        java {
            exclude "me/waltom/wavexin/modules/commandscanner/**"
            exclude "me/waltom/wavexin/modules/highwaywalker/**"
            exclude "me/waltom/wavexin/mixins/ui/MixinMeteorGuiTheme.java"
        }
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor Client
    modImplementation "meteordevelopment:meteor-client:${project.meteor_version}"
    modCompileOnly "meteordevelopment:baritone:${project.baritone_version}"
}

tasks {
    processResources {
        def propertyMap = [
            "version"       : project.version,
            "mc_version"    : project.minecraft_version,
            "loader_version": project.loader_version,
        ]

        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 21
    }
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")

            programArgs("--username", "日天")
            vmArgs("-Dfabric.development=true")
        }
    }
}

def waveXinLangDir = layout.projectDirectory.dir("src/main/resources/assets/wavexin/lang")
def waveXinJavaDir = layout.projectDirectory.dir("src/main/java/me/waltom/wavexin")
def waveXinExpectedKeysFile = waveXinLangDir.file("expected_keys.txt")

tasks.register("verifyWaveXinTranslations") {
    inputs.dir(waveXinLangDir)
    inputs.dir(waveXinJavaDir)
    inputs.file(waveXinExpectedKeysFile)

    doLast {
        def jsonSlurper = new groovy.json.JsonSlurper()
        def langFiles = [
            en_us: waveXinLangDir.file("en_us.json").asFile,
            zh_cn: waveXinLangDir.file("zh_cn.json").asFile
        ]

        def langs = [:]
        def errors = []
        def duplicateJsonCount = 0
        def invalidValueCount = 0
        def meteorTokenMismatches = 0
        def placeholderMismatches = 0

        def duplicateKeys = { File file ->
            def text = file.getText("UTF-8")
            def seen = new LinkedHashSet<String>()
            def duplicates = []
            def matcher = text =~ /(?m)^\s*"((?:\\.|[^"\\])+)"\s*:/
            matcher.each { match ->
                def key = match[1]
                if (!seen.add(key)) duplicates << key
            }
            duplicates
        }

        def looksMojibake = { String value ->
            def badSequences = [
                '\uFFFD',
                '\u00C3',
                '\u00C2',
                '\u00E2\u20AC',
                '\u951F\u65A4\u62F7',
                '\u93C2\u56E7\u74E7',
                '\u6D63\u72B2\u597D'
            ]
            badSequences.any { value.contains(it) }
        }

        langFiles.each { language, file ->
            if (!file.isFile()) {
                errors << "Missing language file: ${file}"
                return
            }

            def duplicates = duplicateKeys(file)
            duplicateJsonCount += duplicates.unique().size()
            if (!duplicates.isEmpty()) {
                errors << "${language} duplicate keys: ${duplicates.unique().join(', ')}"
            }

            def parsed
            try {
                parsed = jsonSlurper.parse(file)
            } catch (Exception e) {
                errors << "${language} is invalid JSON: ${e.message}"
                return
            }

            if (!(parsed instanceof Map)) {
                errors << "${language} root must be a JSON object"
                return
            }

            parsed.each { key, value ->
                if (!(value instanceof String)) {
                    invalidValueCount++
                    errors << "${language}.${key} must be a string"
                    return
                }

                if (value.contains('\uFFFD')) {
                    invalidValueCount++
                    errors << "${language}.${key} contains replacement character"
                }
                if (looksMojibake(value)) {
                    invalidValueCount++
                    errors << "${language}.${key} looks mojibake"
                }
                if (value != value.trim()) {
                    invalidValueCount++
                    errors << "${language}.${key} has leading/trailing whitespace"
                }
                if (value == key) {
                    invalidValueCount++
                    errors << "${language}.${key} value is the raw key"
                }
                if (value.isEmpty() && key != 'setting.wavexin.auto_login.saved_accounts.unnamed.title') {
                    invalidValueCount++
                    errors << "${language}.${key} is empty"
                }
                if (language == 'en_us' && value ==~ /.*\?{2,}.*/) {
                    invalidValueCount++
                    errors << "${language}.${key} contains placeholder question marks"
                }
                if (language == 'en_us' && key.endsWith('.title') && value ==~ /[a-z0-9]+(-[a-z0-9]+)+/) {
                    invalidValueCount++
                    errors << "${language}.${key} exposes a raw kebab-case id"
                }
            }

            langs[language] = parsed
        }

        def expectedKeys = new LinkedHashSet<String>()
        def expectedKeyOccurrences = [:].withDefault { 0 }
        waveXinExpectedKeysFile.asFile.eachLine('UTF-8') { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#')) {
                expectedKeyOccurrences[trimmed]++
                expectedKeys.add(trimmed)
            }
        }

        if (expectedKeys.isEmpty()) errors << "Expected key registry is empty"
        def expectedRegistryDuplicates = expectedKeyOccurrences.findAll { key, count -> count > 1 }.keySet()
        if (!expectedRegistryDuplicates.isEmpty()) {
            errors << "Duplicate expected-key entries: ${expectedRegistryDuplicates.sort().join(', ')}"
        }

        def staticKeys = new LinkedHashSet<String>()
        waveXinJavaDir.asFileTree.matching { include '**/*.java' }.files.each { file ->
            def source = file.getText('UTF-8')
            def matcher = source =~ /"((?:module|group|setting|enum|message|warning|error|debug|status|button|tooltip|placeholder|disconnect|entity)\.wavexin\.[^"]+)"/
            matcher.each { match ->
                def key = match[1]
                if (!key.contains('" + ') && !key.endsWith('.')) staticKeys << key
            }
        }

        def placeholders = { String value ->
            def result = []
            int implicit = 1
            int previous = -1
            def matcher = value =~ /%(?:([1-9]\d*)\$)?([-#+ 0,(<]*)(\d*)(?:\.(\d+))?([a-zA-Z%])/
            matcher.each { match ->
                def conversion = match[5]
                if (conversion == '%') return

                int index
                if (match[1]) {
                    index = Integer.parseInt(match[1])
                } else if (match[2]?.contains('<') && previous > 0) {
                    index = previous
                } else {
                    index = implicit++
                }

                previous = index
                result << "${index}:${conversion}"
            }
            result.sort()
        }

        def meteorTokens = { String value ->
            def result = []
            def matcher = value =~ /\((highlight|bold|default)\)/
            matcher.each { match -> result << match[1] }
            result
        }

        def missingKeyCount = 0
        def deadKeyCount = 0

        if (langs.en_us && langs.zh_cn) {
            def enKeys = langs.en_us.keySet() as Set
            def zhKeys = langs.zh_cn.keySet() as Set

            def missingZh = enKeys - zhKeys
            def missingEn = zhKeys - enKeys
            missingKeyCount += missingZh.size() + missingEn.size()
            if (!missingZh.isEmpty()) errors << "zh_cn missing keys: ${missingZh.sort().join(', ')}"
            if (!missingEn.isEmpty()) errors << "en_us missing keys: ${missingEn.sort().join(', ')}"

            [en_us: enKeys, zh_cn: zhKeys].each { language, keys ->
                def missingExpected = expectedKeys - keys
                def dead = keys - expectedKeys
                missingKeyCount += missingExpected.size()
                deadKeyCount += dead.size()
                if (!missingExpected.isEmpty()) {
                    errors << "${language} missing expected keys: ${missingExpected.sort().join(', ')}"
                }
                if (!dead.isEmpty()) {
                    errors << "${language} unexplained dead keys: ${dead.sort().join(', ')}"
                }
            }

            def missingStatic = staticKeys - expectedKeys
            missingKeyCount += missingStatic.size()
            if (!missingStatic.isEmpty()) {
                errors << "Static Java keys missing from expected registry: ${missingStatic.sort().join(', ')}"
            }

            enKeys.intersect(zhKeys).each { key ->
                def enPlaceholders = placeholders(langs.en_us[key])
                def zhPlaceholders = placeholders(langs.zh_cn[key])
                if (enPlaceholders != zhPlaceholders) {
                    placeholderMismatches++
                    errors << "Placeholder mismatch ${key}: en=${enPlaceholders}, zh=${zhPlaceholders}"
                }

                def enTokens = meteorTokens(langs.en_us[key])
                def zhTokens = meteorTokens(langs.zh_cn[key])
                if (enTokens != zhTokens) {
                    meteorTokenMismatches++
                    errors << "Meteor token mismatch ${key}: en=${enTokens}, zh=${zhTokens}"
                }
            }
        }

        def summary = [
            "en_us=${langs.en_us?.size() ?: 0}",
            "zh_cn=${langs.zh_cn?.size() ?: 0}",
            "expectedRegistry=${expectedKeys.size()}",
            "expectedRegistryDuplicates=${expectedRegistryDuplicates.size()}",
            "staticLiteralKeys=${staticKeys.size()}",
            "duplicateJson=${duplicateJsonCount}",
            "missing=${missingKeyCount}",
            "dead=${deadKeyCount}",
            "placeholderMismatches=${placeholderMismatches}",
            "meteorTokenMismatches=${meteorTokenMismatches}",
            "invalidValues=${invalidValueCount}"
        ].join(', ')

        if (!errors.isEmpty()) {
            println "WaveXin translation verification FAIL: ${summary}"
            throw new GradleException("WaveXin translation verification failed:\n" + errors.join('\n'))
        }

        println "WaveXin translation verification PASS: ${summary}"
    }
}

tasks.register("testWaveXinI18nBehavior", JavaExec) {
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "me.waltom.wavexin.i18n.WaveXinI18nBehaviorTest"
}

tasks.register("testWaveXinChatFilterBehavior", JavaExec) {
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "me.waltom.wavexin.modules.chatfilter.ChatFilterBehaviorTest"
}

tasks.register("testWaveXinBaseFinderBehavior", JavaExec) {
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "me.waltom.wavexin.modules.basefinder.BaseFinderBehaviorTest"
}

tasks.register("testWaveXinTurtlePotionThrowerBehavior", JavaExec) {
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "me.waltom.wavexin.modules.turtlepotionthrower.TurtlePotionThrowerBehaviorTest"
}

tasks.register("testWaveXinLitematicaPrinterBehavior", JavaExec) {
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "me.waltom.wavexin.modules.litematicaprinter.CuboidCursorBehaviorTest"
}

tasks.named("test") {
    dependsOn(tasks.named("testWaveXinI18nBehavior"))
    dependsOn(tasks.named("testWaveXinChatFilterBehavior"))
    dependsOn(tasks.named("testWaveXinBaseFinderBehavior"))
    dependsOn(tasks.named("testWaveXinTurtlePotionThrowerBehavior"))
    dependsOn(tasks.named("testWaveXinLitematicaPrinterBehavior"))
}

tasks.named("check") {
    dependsOn(tasks.named("verifyWaveXinTranslations"))
}
